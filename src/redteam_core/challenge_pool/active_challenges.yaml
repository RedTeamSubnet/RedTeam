ab_sniffer_v6:
  name: "ab_sniffer_v6"
  description: "Detect automation frameworks"
  challenge_incentive_weight: 0.4
  challenge_image: "redteamsubnet61/rest-abs-challenge:6.0.2"
  target: abs_challenge.controller.ABSController
  challenge_manager: abs_challenge.challenge_manager.ABSChallengeManager
  script_path_identifier: "commit_files"
  challenge_type: "abs"
  challenge_solve_timeout: 60
  challenge_min_acceptable_score: 0.4
  docker_run_timeout: 900
  num_tasks: 1
  scoring_headers:
    X-API-KEY: "${RT_CHALLENGE_API_KEY}"
  comparison_config:
    max_unique_commits: 15
    max_self_comparison_score: 0.8
    min_acceptable_score: 0.6
  challenge_container_run_kwargs:
    name: "ab_sniffer_v6"
    platform: "linux/amd64"
    ulimits:
      - Name: "nofile"
        Soft: 65536
        Hard: 65536
    privileged: true
    environment:
      ENV: "PRODUCTION"
      ABS_CHALLENGE_API_KEY: "${RT_CHALLENGE_API_KEY}"
      ABS_CHALLENGE_VERIFICATION_API_KEY: "${ABS_CHALLENGE_VERIFICATION_API_KEY}"
      ABS_CHALLENGE_VERIFICATION_ENDPOINT: "${ABS_CHALLENGE_VERIFICATION_ENDPOINT}"
      ABS_CHALLENGE_VERIFICATION_STARTUP_URL: "${ABS_CHALLENGE_VERIFICATION_STARTUP_URL}"
      ABS_CHALLENGE_BOT_RUNNER_SERVERS: "${ABS_CHALLENGE_BOT_RUNNER_SERVERS}"
      ABS_CHALLENGE_BOT_RUNNER_API_KEY: "${ABS_CHALLENGE_BOT_RUNNER_API_KEY}"
      ABS_CHALLENGE_BOT_RUNNER_PUBLIC_BASE_URL: "${ABS_CHALLENGE_BOT_RUNNER_PUBLIC_BASE_URL}"
      ABS_CHALLENGE_BOT_RUNNER_BOT: "${ABS_CHALLENGE_BOT_RUNNER_BOT}"
      ABS_API_LOGS_DIR: "/var/log/rest-abs-challenge"
    volumes:
      - "${RT_CHALLENGE_LOGS_DIR}:/var/log/rest-abs-challenge"
  miner_container_run_kwargs:
    cpu_count: 4
    mem_limit: "12g"
    network: "redteam_local"
    environment:
      CHALLENGE_NAME: "ab_sniffer_v6"
  protocols:
    challenger: "http"
    challenger_ssl_verify: false
    miner: "http"
    miner_ssl_verify: false
  resource_limits:
    num_cpus: 4
    mem_limit: "12g"

bot_virus_v1:
  name: "bot_virus_v1"
  description: "Building a bot virus to infect the internet"
  challenge_incentive_weight: 0.6
  challenge_image: "redteamsubnet61/rest-bv-challenge:1.0.3"
  target: bv_challenge.controller.BVController
  challenge_manager: bv_challenge.challenge_manager.BVChallengeManager
  script_path_identifier: "commit_files"
  challenge_type: "bv"
  challenge_solve_timeout: 60
  challenge_min_acceptable_score: 0.85
  docker_run_timeout: 900
  num_tasks: 1
  scoring_headers:
    X-API-KEY: "${RT_CHALLENGE_API_KEY}"
  comparison_config:
    max_unique_commits: 15
    max_self_comparison_score: 0.8
    min_acceptable_score: 0.6
  challenge_container_run_kwargs:
    name: "bot_virus_v1"
    platform: "linux/amd64"
    network: "bot-virus-challenge-net"
    privileged: true
    environment:
      ENV: "PRODUCTION"
      BV_CHALLENGE_API_KEY: "${RT_CHALLENGE_API_KEY}"
      BV_CHALLENGE_API_BOT_RUNNER_URL: "${BV_CHALLENGE_API_BOT_RUNNER_URL}"
      MDM_CHALLENGE_BASE_URL: "${MDM_CHALLENGE_BASE_URL}"
      MDM_CHALLENGE_SIMPLE_BOT_URL: "${MDM_CHALLENGE_SIMPLE_BOT_URL}"
      BV_CHALLENGE_SIMPLE_BOT_CHECK_ENABLED: false
      BV_CHALLENGE_WEB_CHECK_ENABLED: true
    volumes:
      - "${RT_CHALLENGE_LOGS_DIR}:/var/log/flowprint-challenge"
  miner_container_run_kwargs:
    cpu_count: 4
    mem_limit: "12g"
    network: "redteam_local"
    environment:
      CHALLENGE_NAME: "bot_virus_v1"
  protocols:
    challenger: "http"
    challenger_ssl_verify: false
    miner: "http"
    miner_ssl_verify: false
  resource_limits:
    num_cpus: 4
    mem_limit: "12g"
