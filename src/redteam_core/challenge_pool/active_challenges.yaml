bot_virus_v2:
  name: "bot_virus_v2"
  description: "Browser extension tracing challenge"
  challenge_incentive_weight: 0.6
  challenge_image: "redteamsubnet61/rest-bv-challenge:2.0.0"
  target: bv_challenge.controller.BVController
  challenge_manager: bv_challenge.challenge_manager.BVChallengeManager
  script_path_identifier: "commit_files"
  challenge_type: "bv"
  challenge_solve_timeout: 10
  challenge_min_acceptable_score: 0.6
  docker_run_timeout: 900
  num_tasks: 1
  scoring_headers:
    X-API-KEY: "${RT_CHALLENGE_API_KEY}"
  comparison_config:
    max_unique_commits: 10
    max_self_comparison_score: 0.8
    min_acceptable_score: 0.6
  challenge_container_run_kwargs:
    name: "bot_virus_v2"
    platform: "linux/amd64"
    shm_size: "2g"
    environment:
      ENV: "PRODUCTION"
      BV_CHALLENGE_API_LOGS_DIR: "/var/log/rest-bv-challenge"
      BV_CHALLENGE_API_KEY: "${RT_CHALLENGE_API_KEY}"
      BV_BOT_RUNNER_ENDPOINT: "${BV_BOT_RUNNER_ENDPOINT}"
      BV_BOT_RUNNER_KEY: "${BV_BOT_RUNNER_KEY}"
      BV_CHALLENGE_BOT_TIMEOUT: "${BV_CHALLENGE_BOT_TIMEOUT}"
    volumes:
      - "${RT_CHALLENGE_LOGS_DIR}:/var/log/rest-bv-challenge"
  miner_container_run_kwargs:
    cpu_count: 4
    mem_limit: "12g"
    network: "redteam_local"
    environment:
      CHALLENGE_NAME: "bot_virus_v2"
  protocols:
    challenger: "http"
    challenger_ssl_verify: false
    miner: "http"
    miner_ssl_verify: false
  resource_limits:
    num_cpus: 4
    mem_limit: "12g"

