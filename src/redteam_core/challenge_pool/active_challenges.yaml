bex_tracer_v1:
  name: "bex_tracer_v1"
  description: "Browser extension tracing challenge"
  challenge_incentive_weight: 0.4
  challenge_image: "redteamsubnet61/rest-bex-challenge:0.0.2"
  target: bex_tracer.controller.BEXController
  challenge_manager: bex_tracer.challenge_manager.BEXChallengeManager
  script_path_identifier: "commit_files"
  challenge_type: "bex"
  challenge_solve_timeout: 60
  challenge_min_acceptable_score: 0.85
  docker_run_timeout: 900
  num_tasks: 1
  scoring_headers:
    X-API-KEY: "${RT_CHALLENGE_API_KEY}"
  comparison_config:
    max_unique_commits: 7
    max_self_comparison_score: 0.8
    min_acceptable_score: 0.6
  challenge_container_run_kwargs:
    name: "bex_tracer_v1"
    platform: "linux/amd64"
    network: "redteam_local"
    privileged: true
    environment:
      ENV: "PRODUCTION"
      BEX_CHALLENGE_API_LOGS_DIR: "/var/log/rest-bex-challenge"
      BEX_CHALLENGE_API_KEY: "${RT_CHALLENGE_API_KEY}"
    volumes:
      - "${RT_CHALLENGE_LOGS_DIR}:/var/log/rest-bex-challenge"
  miner_container_run_kwargs:
    cpu_count: 4
    mem_limit: "12g"
    network: "redteam_local"
    environment:
      CHALLENGE_NAME: "bex_tracer_v1"
  protocols:
    challenger: "http"
    challenger_ssl_verify: false
    miner: "http"
    miner_ssl_verify: false
  resource_limits:
    num_cpus: 4
    mem_limit: "12g"

ada_detection_v3:
  name: "ada_detection_v3"
  description: "Detect commercial anti-detect browsers"
  challenge_incentive_weight: 0.6
  challenge_image: "redteamsubnet61/ada_detection:3.0.4"
  target: ada_challenge.controller.ADAController
  challenge_manager: ada_challenge.challenge_manager.ADAChallengeManager
  script_path_identifier: "commit_files"
  challenge_type: "ada"
  challenge_solve_timeout: 60
  challenge_min_acceptable_score: 0.5
  docker_run_timeout: 900
  num_tasks: 1
  scoring_headers:
    X-API-KEY: "${RT_CHALLENGE_API_KEY}"
  comparison_config:
    max_unique_commits: 7
    max_self_comparison_score: 0.8
    min_acceptable_score: 0.6
  challenge_container_run_kwargs:
    name: "ada_detection_v3"
    platform: "linux/amd64"
    ulimits:
      - Name: "nofile"
        Soft: 65536
        Hard: 65536
    privileged: true
    environment:
      ENV: "PRODUCTION"
      ADA_CHALLENGE_API_KEY: "${RT_CHALLENGE_API_KEY}"
      ADA_CHALLENGE_VERIFICATION_API_KEY: "${ADA_CHALLENGE_VERIFICATION_API_KEY}"
      ADA_CHALLENGE_VERIFICATION_ENDPOINT: "${ADA_CHALLENGE_VERIFICATION_ENDPOINT}"
      ADA_CHALLENGE_VERIFICATION_STARTUP_URL: "${ADA_CHALLENGE_VERIFICATION_STARTUP_URL}"
      ADA_CHALLENGE_BOT_RUNNER_SERVERS: "${ADA_CHALLENGE_BOT_RUNNER_SERVERS}"
      ADA_CHALLENGE_BOT_RUNNER_API_KEY: "${ADA_CHALLENGE_BOT_RUNNER_API_KEY}"
      ADA_CHALLENGE_BOT_RUNNER_PUBLIC_BASE_URL: "${ADA_CHALLENGE_BOT_RUNNER_PUBLIC_BASE_URL}"
      ADA_CHALLENGE_BOT_RUNNER_BOT: "${ADA_CHALLENGE_BOT_RUNNER_BOT}"
      ADA_API_LOGS_DIR: "/var/log/ada_detection"
    volumes:
      - "${RT_CHALLENGE_LOGS_DIR}/ada_detection:/var/log/ada_detection"
  miner_container_run_kwargs:
    cpu_count: 4
    mem_limit: "12g"
    network: "redteam_local"
    environment:
      CHALLENGE_NAME: "ada_detection_v3"
  protocols:
    challenger: "http"
    challenger_ssl_verify: false
    miner: "http"
    miner_ssl_verify: false
  resource_limits:
    num_cpus: 4
    mem_limit: "12g"
